<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #1e1e2f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .weather-card {
            width: 90%;
            max-width: 400px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .search-box {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .search-box input {
            border: 0;
            outline: 0;
            background: #ffffff;
            color: #333;
            padding: 12px 20px;
            height: 50px;
            border-radius: 30px;
            flex: 1;
            margin-right: 12px;
            font-size: 15px;
        }

        .search-box button {
            border: 0;
            outline: 0;
            background: #ffffff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .search-box button:hover {
            background: #e0e0e0;
        }

        .search-box button i {
            color: #333;
            font-size: 18px;
        }

        .weather-icon {
            width: 130px;
            margin-top: 25px;
        }

        .temp {
            font-size: 65px;
            font-weight: 600;
        }

        .city {
            font-size: 32px;
            font-weight: 400;
            margin-top: -5px;
        }

        .details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            margin-top: 35px;
        }

        .col {
            display: flex;
            align-items: center;
            text-align: left;
        }

        .col i {
            font-size: 30px;
            margin-right: 10px;
        }

        .col p {
            font-size: 18px;
            font-weight: 500;
        }

        .col span {
            font-size: 13px;
            font-weight: 300;
            display: block;
        }

        .error {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #ff4d4d;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 8px;
            display: none;
        }

        .weather-data {
            display: block;
        }
    </style>
</head>
<body>

    <div class="weather-card">
        <!-- Search Box -->
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name..." spellcheck="false" value="Mumbai">
            <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <!-- Error Message -->
        <div class="error" id="error-msg">
            Invalid city name. Please try again!
        </div>

        <!-- Weather Display -->
        <div class="weather-data" id="weather-data">
            <img src="https://cdn-icons-png.flaticon.com/512/116/116451.png" alt="Weather Icon" class="weather-icon" id="weather-icon">
            <h1 class="temp" id="temp">--°C</h1>
            <h2 class="city" id="city">Loading...</h2>

            <div class="details">
                <div class="col">
                    <i class="fa-solid fa-water"></i>
                    <div>
                        <p class="humidity" id="humidity">--%</p>
                        <span>Humidity</span>
                    </div>
                </div>
                <div class="col">
                    <i class="fa-solid fa-wind"></i>
                    <div>
                        <p class="wind" id="wind">-- km/h</p>
                        <span>Wind Speed</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const cityInput = document.getElementById("city-input");
        const searchBtn = document.getElementById("search-btn");
        const weatherIcon = document.getElementById("weather-icon");
        const errorMsg = document.getElementById("error-msg");
        const weatherData = document.getElementById("weather-data");

        // Public Free Open-Meteo & Geocoding API (Directly Working Without Key Issue)
        async function checkWeather(cityName) {
            try {
                // 1. Get Lat & Long for the City
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=en&format=json`;
                const geoRes = await fetch(geoUrl);
                const geoData = await geoRes.json();

                if (!geoData.results || geoData.results.length === 0) {
                    errorMsg.style.display = "block";
                    weatherData.style.display = "none";
                    return;
                }

                const { latitude, longitude, name } = geoData.results[0];

                // 2. Fetch Weather Data
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code`;
                const weatherRes = await fetch(weatherUrl);
                const data = await weatherRes.json();

                // 3. Update DOM Elements
                document.getElementById("city").innerText = name;
                document.getElementById("temp").innerText = Math.round(data.current.temperature_2m) + "°C";
                document.getElementById("humidity").innerText = data.current.relative_humidity_2m + "%";
                document.getElementById("wind").innerText = Math.round(data.current.wind_speed_10m) + " km/h";

                // Update Icon Based on Weather Code
                const code = data.current.weather_code;
                if (code === 0) {
                    weatherIcon.src = "https://cdn-icons-png.flaticon.com/512/869/869869.png"; // Clear Sun
                } else if (code >= 1 && code <= 3) {
                    weatherIcon.src = "https://cdn-icons-png.flaticon.com/512/116/116451.png"; // Clouds
                } else if (code >= 51 && code <= 67) {
                    weatherIcon.src = "https://cdn-icons-png.flaticon.com/512/3351/3351979.png"; // Rain
                } else {
                    weatherIcon.src = "https://cdn-icons-png.flaticon.com/512/4005/4005901.png"; // Haze/Fog
                }

                weatherData.style.display = "block";
                errorMsg.style.display = "none";

            } catch (err) {
                errorMsg.style.display = "block";
                weatherData.style.display = "none";
            }
        }

        // Search Button Click Event
        searchBtn.addEventListener("click", () => {
            if (cityInput.value.trim() !== "") {
                checkWeather(cityInput.value.trim());
            }
        });

        // Enter Key Press Event
        cityInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && cityInput.value.trim() !== "") {
                checkWeather(cityInput.value.trim());
            }
        });

        // Default Weather Load
        checkWeather("Mumbai");
    </script>
</body>
</htm>
